# The Linux/Windows bundles (docs/ROADMAP.md item 3): PyInstaller onedir
# via nfh.spec, smoke-tested headless, uploaded as artifacts on every run
# and attached to the release on a v* tag. The game's data is not in the
# repo and not in the bundle — the bundle extracts the assets from the
# user's own apk/obb on first run.
name: bundles

on:
  push:
    branches: [master, main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
            archive: tar
          - os: windows-latest
            name: windows-x86_64
            archive: zip
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --upgrade pysdl2 pysdl2-dll pillow pyinstaller

      - name: Build the bundle
        run: pyinstaller --clean --noconfirm nfh.spec

      - name: Smoke the bundle (headless)
        shell: bash
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: ./dist/nfh/nfh --smoke

      - name: Package (linux)
        if: matrix.archive == 'tar'
        run: |
          cp docs/BUNDLE.md dist/nfh/README.md
          tar -C dist -czf nfh-${{ matrix.name }}.tar.gz nfh

      - name: Package (windows)
        if: matrix.archive == 'zip'
        shell: bash
        run: |
          cp docs/BUNDLE.md dist/nfh/README.md
          cd dist && 7z a ../nfh-${{ matrix.name }}.zip nfh

      - uses: actions/upload-artifact@v4
        with:
          name: nfh-${{ matrix.name }}
          path: nfh-${{ matrix.name }}.*
          if-no-files-found: error

  release:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create '${{ github.ref_name }}' --repo '${{ github.repository }}' \
            --generate-notes nfh-*.tar.gz nfh-*.zip || \
          gh release upload '${{ github.ref_name }}' --repo '${{ github.repository }}' \
            nfh-*.tar.gz nfh-*.zip
      - name: Rolling prerelease (every master build)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --repo '${{ github.repository }}' \
            --yes --cleanup-tag || true
          gh release create latest --repo '${{ github.repository }}' \
            --target '${{ github.sha }}' --prerelease \
            --title 'latest (${{ github.sha }})' \
            --notes 'Automatic build of the newest master commit.' \
            nfh-*.tar.gz nfh-*.zip
